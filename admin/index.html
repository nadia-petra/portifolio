<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel | Nadia Petra</title>
<meta name="theme-color" content="#F6F1E8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   PAINEL DA NADIA
   Mesmas cores do portfólio (linho, sálvia e rosé), uma fonte só (Jost).
   ===================================================================== */
:root{
  --linho:#F6F1E8; --papel:#EAE0D0; --card:#DCCBB7; --branco:#fbf8f2;
  --tinta:#4B3A2F; --tinta-suave:#6a5546; --linha:rgba(75,58,47,.14); --linha-forte:rgba(75,58,47,.28);
  --salvia:#A7AD91; --salvia-escura:#7f8669; --salvia-suave:rgba(167,173,145,.28);
  --rose:#C99B91; --rose-texto:#8a5248; --rose-suave:rgba(201,155,145,.22);
  --vermelho:#a8453a; --vermelho-suave:#f3dcd6; --amarelo:#8a6a14; --amarelo-suave:#f4e8c1;
  --raio:6px; --menu-l:232px;
}
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; font-family:"Jost", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  font-size:14px; line-height:1.5; color:var(--tinta); background:var(--linho);
}
/* A página só aparece depois de conferir a sessão */
body.conferindo .app{ display:none; }
.carregando-tela{ display:none; }
body.conferindo .carregando-tela{ display:grid; place-items:center; min-height:100vh; color:var(--tinta-suave); font-size:13px; }
a{ color:var(--rose-texto); }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--rose-texto); outline-offset:2px; }
[hidden]{ display:none !important; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
svg.ic{ width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }

/* ============ MENU LATERAL ============ */
.menu{
  position:fixed; top:0; bottom:0; left:0; width:var(--menu-l); z-index:40;
  display:flex; flex-direction:column; background:var(--papel); border-right:1px solid var(--linha);
}
.menu-marca{ padding:20px 20px 14px; font-weight:600; font-size:13px; letter-spacing:.08em; text-transform:uppercase; }
.menu-marca small{ display:block; font-weight:400; letter-spacing:0; text-transform:none; color:var(--tinta-suave); font-size:12px; }
.menu nav{ flex:1; overflow-y:auto; padding:4px 12px; }
.menu h2{ font-size:11px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--tinta-suave); margin:16px 8px 6px; }
.menu a.item{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--raio);
  color:var(--tinta); text-decoration:none; font-size:13.5px;
}
.menu a.item:hover{ background:rgba(167,173,145,.16); }
.menu a.item.ativo{ background:var(--salvia-suave); font-weight:500; }
.menu-rodape{ border-top:1px solid var(--linha); padding:12px 16px 16px; font-size:12px; }
.menu-rodape .email{ color:var(--tinta-suave); word-break:break-all; margin-bottom:8px; }
.menu-rodape .acoes-rodape{ display:flex; gap:8px; }

/* ============ CONTEÚDO ============ */
.conteudo{ margin-left:var(--menu-l); min-height:100vh; }
.barra{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
  padding:12px 24px; background:rgba(246,241,232,.94); border-bottom:1px solid var(--linha);
  backdrop-filter:blur(6px);
}
.barra h1{ font-size:16px; font-weight:600; margin:0; flex:1; }
.btn-icone.gaveta-btn{ display:none; }
.miolo{ padding:20px 24px 60px; max-width:1240px; }
.avisos{ display:grid; gap:8px; margin-bottom:16px; }
.aviso{
  display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:var(--raio);
  background:var(--amarelo-suave); color:#5b4510; border:1px solid #e3cf8f; font-size:13px;
}
.aviso b{ font-weight:600; }
.aviso button{ margin-left:auto; background:none; border:0; cursor:pointer; padding:0 4px; font-size:16px; line-height:1; }

/* ============ PEÇAS COMUNS ============ */
.bloco{ background:var(--branco); border:1px solid var(--linha); border-radius:var(--raio); margin-bottom:16px; }
.bloco-topo{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--linha); }
.bloco-topo h3{ font-size:13px; font-weight:600; margin:0; margin-right:auto; }
.bloco-corpo{ padding:14px; }
.vazio{ padding:22px 14px; text-align:center; color:var(--tinta-suave); font-size:13px; }
.btn{
  display:inline-flex; align-items:center; gap:6px; min-height:34px; padding:6px 12px;
  border-radius:var(--raio); border:1px solid var(--linha-forte); background:var(--branco);
  cursor:pointer; font-size:13px; text-decoration:none; color:var(--tinta); white-space:nowrap;
}
.btn:hover{ background:var(--linho); }
.btn.principal{ background:var(--salvia); border-color:var(--salvia-escura); }
.btn.principal:hover{ background:#b6bba1; }
.btn.perigo{ color:var(--vermelho); border-color:#dcb1a9; }
.btn.perigo:hover{ background:var(--vermelho-suave); }
.btn.pequeno{ min-height:28px; padding:3px 8px; font-size:12px; }
.btn-icone{
  display:inline-grid; place-items:center; width:30px; height:30px; border-radius:var(--raio);
  border:0; background:transparent; cursor:pointer; color:var(--tinta-suave);
}
.btn-icone:hover{ background:var(--linho); color:var(--tinta); }
.btn-icone.on{ color:var(--rose-texto); }
input.campo, select.campo, textarea.campo{
  min-height:34px; padding:6px 10px; font:inherit; font-size:13px; color:var(--tinta);
  background:var(--branco); border:1px solid var(--linha-forte); border-radius:var(--raio);
}
input.campo:focus, select.campo:focus, textarea.campo:focus{ outline:none; border-color:var(--salvia-escura); box-shadow:0 0 0 3px rgba(167,173,145,.4); }
.busca{ min-width:200px; flex:1; max-width:320px; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{
  min-height:30px; padding:4px 12px; border-radius:30px; font-size:12.5px; cursor:pointer;
  background:var(--branco); border:1px solid var(--linha-forte);
}
.chip[aria-pressed="true"]{ background:var(--salvia-suave); border-color:var(--salvia-escura); font-weight:500; }
.pilula{
  display:inline-block; padding:2px 9px; border-radius:30px; font-size:11.5px; font-weight:500; white-space:nowrap;
  background:var(--linho); color:var(--tinta); border:1px solid var(--linha);
}
.etiqueta{ display:inline-block; padding:1px 6px; border-radius:4px; font-size:10.5px; font-weight:500; letter-spacing:.03em; text-transform:uppercase; vertical-align:1px; margin-left:6px; }
.etiqueta.exemplo{ background:var(--amarelo-suave); color:#5b4510; }
.etiqueta.site{ background:var(--rose-suave); color:var(--rose-texto); }
.suave{ color:var(--tinta-suave); }

/* Faixa fina dividida (indicadores) */
.faixa{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
  background:var(--branco); border:1px solid var(--linha); border-radius:var(--raio); margin-bottom:16px; overflow:hidden;
}
.faixa > div{ padding:12px 14px; border-right:1px solid var(--linha); min-width:0; }
.faixa > div:last-child{ border-right:0; }
.faixa small{ display:block; font-size:11.5px; color:var(--tinta-suave); }
.faixa strong{ display:block; font-size:18px; font-weight:600; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.faixa span{ display:block; font-size:11.5px; color:var(--tinta-suave); line-height:1.35; }

/* Planilhas */
.tabela-rolagem{ overflow-x:auto; position:relative; }
table.planilha{ width:100%; border-collapse:collapse; font-size:13px; }
.planilha th{
  text-align:left; font-weight:500; font-size:11.5px; color:var(--tinta-suave); text-transform:uppercase; letter-spacing:.04em;
  padding:8px 10px; border-bottom:1px solid var(--linha); white-space:nowrap; background:var(--branco);
}
.planilha td{ padding:8px 10px; border-bottom:1px solid var(--linha); vertical-align:middle; }
.planilha tr:last-child td{ border-bottom:0; }
.planilha tbody tr.clicavel{ cursor:pointer; }
.planilha tbody tr.clicavel:hover td{ background:rgba(234,224,208,.45); }
.planilha .num{ text-align:right; font-variant-numeric:tabular-nums; }
.planilha .corte{ max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.planilha tr.escondido td{ opacity:.5; }
.planilha tr.favorita td:first-child{ box-shadow:inset 3px 0 0 var(--rose); }
.planilha tr.arrastando td{ background:var(--salvia-suave); }
th.ordena{ cursor:pointer; user-select:none; }
th.ordena:hover{ color:var(--tinta); }
th .seta{ display:inline-block; width:12px; text-align:center; margin-left:3px; opacity:.35; }
th.ativa .seta{ opacity:1; color:var(--rose-texto); }
.alca{ cursor:grab; touch-action:none; color:var(--tinta-suave); }
.alca:active{ cursor:grabbing; }
.miniatura{ width:34px; height:48px; border-radius:4px; object-fit:cover; background:var(--card); display:block; }
.acoes-linha{ display:flex; gap:2px; justify-content:flex-end; }

/* Portfólio: gráfico e origens */
.duas-colunas{ display:grid; grid-template-columns:2fr 1fr; gap:16px; }
.grafico{ display:flex; align-items:flex-end; gap:6px; height:170px; padding-top:18px; }
.grafico .coluna{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width:0; }
.grafico .barra-g{ width:100%; max-width:30px; background:var(--salvia); border-radius:3px 3px 0 0; position:relative; min-height:2px; }
.grafico .barra-g.hoje{ background:var(--rose); }
.grafico .barra-g b{ position:absolute; top:-17px; left:50%; transform:translateX(-50%); font-size:10.5px; font-weight:500; color:var(--tinta-suave); }
.grafico .dia{ font-size:10px; color:var(--tinta-suave); margin-top:4px; white-space:nowrap; }
.origens{ list-style:none; margin:0; padding:0; display:grid; gap:10px; }
.origens li{ font-size:13px; }
.origens .linha-o{ display:flex; justify-content:space-between; gap:8px; }
.origens .trilho{ height:5px; background:var(--linho); border-radius:3px; margin-top:4px; overflow:hidden; }
.origens .trilho i{ display:block; height:100%; background:var(--rose); border-radius:3px; }

/* Situações das marcas */
.sit-lead{ background:#f3e1dc; color:#7a4238; border-color:#e5c5bd; }
.sit-conversando{ background:var(--amarelo-suave); color:#5b4510; border-color:#e6d49a; }
.sit-cliente{ background:#e1e5d3; color:#3f4530; border-color:#c6cbb2; }
.sit-parada{ background:#e8e4df; color:#6b625a; border-color:#d6cfc6; }

/* Campanhas: pílulas de tipo, status e prazo */
.tipo-conteudo{ background:#e1e5d3; color:#3f4530; border-color:#c6cbb2; }
.tipo-publicidade{ background:#f3e1dc; color:#7a4238; border-color:#e5c5bd; }
.st-0{ background:#efe9df; } .st-1{ background:#f4e8c1; } .st-2{ background:#f3dcc4; }
.st-3{ background:#f0d6cf; } .st-4{ background:#e6d7e4; } .st-5{ background:#dfe5cf; } .st-6{ background:#cfd8bd; color:#3f4530; }
.prazo-alerta{ display:inline-block; margin-left:6px; padding:1px 6px; border-radius:4px; font-size:10.5px; font-weight:500; }
.prazo-alerta.atrasado{ background:var(--vermelho-suave); color:var(--vermelho); }
.prazo-alerta.perto{ background:var(--amarelo-suave); color:var(--amarelo); }
.pago{ color:#4f5a33; } .pendente{ color:var(--rose-texto); }
.estrela{ color:var(--tinta-suave); }
.estrela.on{ color:#c28a2b; }
.estrela.on svg{ fill:#e6b75a; }

/* Calendário */
.cal-topo{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:12px; }
.cal-topo .mes{ font-size:15px; font-weight:600; min-width:150px; text-align:center; }
.cal-topo .chips{ margin-left:auto; }
.cal{ display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); background:var(--branco); border:1px solid var(--linha); border-radius:var(--raio); overflow:hidden; }
.cal-cab{ padding:6px 8px; font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.05em; color:var(--tinta-suave); border-bottom:1px solid var(--linha); background:var(--linho); }
.cal-dia{ position:relative; min-height:104px; padding:4px 5px 6px; border-right:1px solid var(--linha); border-bottom:1px solid var(--linha); cursor:pointer; min-width:0; }
.cal-dia:nth-child(7n){ border-right:0; }
.cal-dia.fora{ background:rgba(234,224,208,.25); }
.cal-dia.fora .n, .cal-dia.fora .ev{ opacity:.45; }
.cal-dia .n{ display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; font-size:12px; font-weight:500; }
.cal-dia.hoje{ background:rgba(167,173,145,.14); }
.cal-dia.hoje .n{ background:var(--salvia); color:var(--tinta); font-weight:600; }
.cal-dia .mais-add{
  position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; border:0;
  background:var(--salvia-suave); color:var(--tinta); cursor:pointer; opacity:0; display:grid; place-items:center; padding:0;
}
.cal-dia:hover .mais-add, .cal-dia .mais-add:focus{ opacity:1; }
.ev{
  display:block; width:100%; text-align:left; margin-top:3px; padding:2px 5px; border-radius:4px; border:0; cursor:pointer;
  font-size:11.5px; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.ev.gravar{ background:#f3e1dc; } .ev.editar{ background:#efe3c6; } .ev.postar{ background:#e1e5d3; }
.ev.prazo{ background:transparent; border:1px dashed var(--rose); color:var(--rose-texto); }
.ev.feito{ text-decoration:line-through; opacity:.6; }
.ev-mais{ background:none; border:0; padding:2px 5px; font-size:11.5px; color:var(--rose-texto); cursor:pointer; font-weight:500; }
.legenda-cal{ display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; font-size:11.5px; color:var(--tinta-suave); }
.legenda-cal i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
.atras{ list-style:none; margin:0; padding:0; }
.atras li{ display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--linha); font-size:13px; }
.atras li:last-child{ border-bottom:0; }
.atras .ha{ margin-left:auto; color:var(--vermelho); font-size:12px; white-space:nowrap; }

/* Checklist */
.sub-abas{ display:flex; flex-wrap:wrap; gap:4px; border-bottom:1px solid var(--linha); margin-bottom:16px; }
.sub-abas button{
  background:none; border:0; border-bottom:2px solid transparent; padding:8px 12px; cursor:pointer; font-size:13px; color:var(--tinta-suave);
}
.sub-abas button[aria-selected="true"]{ color:var(--tinta); border-bottom-color:var(--salvia-escura); font-weight:500; }
.progresso{ height:6px; background:var(--linho); border-radius:3px; overflow:hidden; }
.progresso i{ display:block; height:100%; background:var(--salvia-escura); border-radius:3px; transition:width .3s; }
.progresso-geral{ display:flex; align-items:center; gap:12px; margin-bottom:14px; font-size:13px; }
.progresso-geral .progresso{ flex:1; }
details.dobra{ background:var(--branco); border:1px solid var(--linha); border-radius:var(--raio); margin-bottom:10px; }
details.dobra > summary{ list-style:none; cursor:pointer; padding:12px 14px; display:flex; align-items:center; gap:10px; }
details.dobra > summary::-webkit-details-marker{ display:none; }
details.dobra > summary .titulo-d{ font-weight:500; }
details.dobra > summary .resumo-d{ display:block; font-size:12px; color:var(--tinta-suave); font-weight:400; }
details.dobra > summary .lado{ margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; color:var(--tinta-suave); white-space:nowrap; }
details.dobra > summary .lado .progresso{ width:80px; }
details.dobra > summary .seta-d{ transition:transform .2s; }
details.dobra[open] > summary .seta-d{ transform:rotate(90deg); }
.dobra-corpo{ padding:0 14px 14px; }
.porque{ background:var(--linho); border-radius:var(--raio); padding:10px 12px; font-size:13px; margin-bottom:10px; }
.itens-check{ list-style:none; margin:0; padding:0; }
.itens-check li{ border-top:1px solid var(--linha); }
.itens-check label{ display:flex; gap:10px; padding:9px 2px; cursor:pointer; }
.itens-check input{ margin-top:3px; width:16px; height:16px; accent-color:var(--salvia-escura); flex:none; }
.itens-check .t{ font-weight:500; }
.itens-check .d{ display:block; font-size:12.5px; color:var(--tinta-suave); }
.itens-check input:checked + span .t{ text-decoration:line-through; text-decoration-color:var(--salvia-escura); }
.grade-ref{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:12px; }
.cartao-ref{ text-align:left; background:var(--branco); border:1px solid var(--linha); border-radius:var(--raio); padding:8px; cursor:pointer; }
.cartao-ref:hover{ border-color:var(--rose); }
.cartao-ref .capa{ position:relative; aspect-ratio:9/16; border-radius:4px; overflow:hidden; background:var(--card); }
.cartao-ref .capa img{ width:100%; height:100%; object-fit:cover; display:block; }
.cartao-ref .emoji{ position:absolute; top:6px; left:6px; background:var(--branco); border-radius:4px; padding:1px 6px; font-size:14px; }
.cartao-ref b{ display:block; margin-top:8px; font-size:13px; font-weight:500; }
.cartao-ref span{ display:block; font-size:12px; color:var(--tinta-suave); }
.blocos-tempo{ display:grid; gap:6px; margin:8px 0; }
.blocos-tempo > div{ display:grid; grid-template-columns:78px 1fr; gap:10px; padding:8px 10px; background:var(--linho); border-radius:var(--raio); font-size:13px; }
.blocos-tempo .tempo{ font-weight:600; color:var(--rose-texto); font-size:12px; }
.ficha h4{ font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--tinta-suave); margin:14px 0 4px; font-weight:500; }
.ficha p{ margin:0; font-size:13.5px; }
.ideias{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px; }
.ideias .bloco-corpo ul{ list-style:none; margin:0; padding:0; }
.ideias li{ padding:8px 0; border-top:1px solid var(--linha); font-size:13px; }
.ideias li:first-child{ border-top:0; }
.ideias li i{ display:block; color:var(--tinta-suave); font-size:12.5px; }
.revisar{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
.revisar textarea{ width:100%; min-height:360px; resize:vertical; line-height:1.6; }

/* ============ JANELA (modal) ============ */
dialog.janela{
  width:min(520px, calc(100% - 24px)); max-height:calc(100dvh - 24px); padding:0; border:0; border-radius:var(--raio);
  background:var(--branco); color:var(--tinta); box-shadow:0 20px 50px rgba(75,58,47,.3);
}
dialog.janela.larga{ width:min(720px, calc(100% - 24px)); }
dialog.janela::backdrop{ background:rgba(75,58,47,.4); }
.janela-topo{ display:flex; align-items:center; gap:8px; padding:14px 16px; border-bottom:1px solid var(--linha); position:sticky; top:0; background:var(--branco); z-index:1; }
.janela-topo h2{ font-size:14px; font-weight:600; margin:0; flex:1; }
.janela-corpo{ padding:16px; }
.janela-rodape{ display:flex; gap:8px; justify-content:flex-end; padding:12px 16px; border-top:1px solid var(--linha); position:sticky; bottom:0; background:var(--branco); }
.janela-rodape .esquerda{ margin-right:auto; }
.form-grade{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.form-grade .inteiro{ grid-column:1 / -1; }
.form-grade label{ display:block; font-size:12px; font-weight:500; margin-bottom:4px; }
.form-grade .campo{ width:100%; }
.form-grade .dica{ font-size:11.5px; color:var(--tinta-suave); margin-top:3px; }
.marcar{ display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; }
.marcar input{ width:16px; height:16px; accent-color:var(--salvia-escura); }
.erro-form{ background:var(--vermelho-suave); color:var(--vermelho); padding:8px 10px; border-radius:var(--raio); font-size:12.5px; margin-bottom:12px; }

/* Aviso rápido (toast) */
.toast{
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px); z-index:100;
  background:var(--tinta); color:var(--linho); padding:9px 16px; border-radius:var(--raio); font-size:13px;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; max-width:calc(100% - 32px);
}
.toast.visivel{ opacity:1; transform:translateX(-50%); }
.toast.erro{ background:var(--vermelho); }

/* ============ CELULAR: menu vira gaveta ============ */
.fundo-gaveta{ display:none; }
@media (max-width:900px){
  .menu{ transform:translateX(-100%); transition:transform .25s; box-shadow:none; }
  .menu.aberta{ transform:none; box-shadow:0 0 40px rgba(75,58,47,.3); }
  .fundo-gaveta.visivel{ display:block; position:fixed; inset:0; z-index:35; background:rgba(75,58,47,.35); }
  .conteudo{ margin-left:0; }
  .btn-icone.gaveta-btn{ display:inline-grid; }
  .barra{ padding:10px 14px; }
  .miolo{ padding:14px 12px 60px; }
  .duas-colunas, .revisar{ grid-template-columns:1fr; }
  .cal-dia{ min-height:70px; padding:3px; }
  .ev{ font-size:10px; padding:1px 3px; }
  .cal-topo .chips{ margin-left:0; width:100%; }
}
@media (max-width:560px){
  .form-grade{ grid-template-columns:1fr; }
  .busca{ max-width:none; min-width:0; flex:1 1 100%; }
  .cal-cab{ font-size:9.5px; padding:5px 3px; text-align:center; }
  .cal-dia .n{ width:20px; height:20px; font-size:11px; }
  .cal-dia .ev{ height:6px; padding:0; font-size:0; }
  .cal-dia .ev-mais{ font-size:10px; padding:0; }
  .faixa strong{ font-size:16px; }
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{ transition:none !important; } }
</style>
</head>
<body class="conferindo">
<div class="carregando-tela">Conferindo o seu acesso...</div>

    <nav>

      <a class="item" href="#marcas" data-aba="marcas">
